url: https://joonho112.github.io/catchmentACS

template:
  bootstrap: 5
  bootswatch: cosmo
  bslib:
    primary: "#C44536"
  math-rendering: katex

llm-docs: false

home:
  title: "catchmentACS: Isochrone-Based Area-Weighted ACS Aggregation"
  description: >
    Generate drive-time isochrones around early-childhood program sites and
    aggregate American Community Survey (ACS) census-tract estimates to those
    catchments by area weighting, with propagated margins of error and curated
    rate indicators. Built for Pre-K funding-equity analysis.

authors:
  JoonHo Lee:
    href: https://github.com/joonho112

footer:
  structure:
    left: developed_by
    right: built_with

