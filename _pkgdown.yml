llm-docs: false

home:
  title: "catchmentACS: Isochrone-Based Area-Weighted ACS Aggregation"
  description: >
    Computes American Community Survey (ACS) estimates for the area within a
    given drive time of each of a set of points, such as the locations of
    pre-kindergarten classrooms. Such an area is called an isochrone, and the
    estimates of the census tracts that overlap it are combined with two
    area-based weights: for a count, the share of each tract's area that lies
    inside, and for the medians and per-person values of three ACS tables
    (median household income, median home value, and per capita income), each
    tract's share of the overlapping area. A median or per-person value from any
    other table is added up like a count. Every estimate comes with a margin of
    error, the half-width of its confidence interval (90 percent by default),
    and a record of how it was produced.

